name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-cli-and-api:
    name: Python CLI & FastAPI suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Verify CLI batch run (baseline, unsafe, invalid)
        run: |
          chmod +x run.sh
          ./run.sh --mode demo --dataset samples/baseline.json --output /tmp/ci-baseline
          ./run.sh --mode demo --dataset samples/unsafe.json --output /tmp/ci-unsafe
          set +e
          ./run.sh --mode demo --dataset samples/invalid.json --output /tmp/ci-invalid
          status=$?
          set -e
          test "$status" -eq 2

      - name: Run 30 CLI unittest cases
        run: python3 -m unittest discover -s tests -v

      - name: Install backend requirements and verify Alembic migration
        run: |
          python3 -m pip install -r backend/requirements.txt
          DATABASE_URL="sqlite:////tmp/ci_kernelscope.db" PYTHONPATH=. alembic -c backend/alembic.ini upgrade head

      - name: Run 9 FastAPI and SQLite pytest cases
        run: PYTHONPATH=. pytest backend/tests -q

  frontend-test-and-build:
    name: React Vitest, TypeScript & Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run 26 Vitest unit and component tests
        run: npm --prefix frontend test

      - name: Check TypeScript project references and production bundle
        run: |
          (cd frontend && npx tsc -b --pretty false)
          npm --prefix frontend run build
